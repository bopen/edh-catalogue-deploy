[project]
name = "edh-catalogue-deploy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "edh-catalogue-api[server]",
    "edh-catalogue-manager"
]

[tool.uv]
package = false
override-dependencies = []
# certifi >= 2026.10.19 fixes GHSA-6q48-6c7w-9gw2 
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.uv.workspace]
members = [
    "../edh-catalogue-api",
    "../edh-catalogue-manager"
]

[tool.uv.sources]
edh-catalogue-api = { workspace = true }
edh-catalogue-manager = { workspace = true }
